<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>उर्व संसार | Urva Sansar - Smart Farming Nepal</title>
  <meta name="description"
    content="Urva Sansar – Smart Farming Ecosystem for Nepal. AI-powered crop advice, disease detection, market prices, and more." />
  <link rel="icon" href="../assets/logo.png" />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            earth: {
              50: '#faf6f1', 100: '#f0e8db', 200: '#e0d0b8', 300: '#ccb48e',
              400: '#b8976a', 500: '#a07c52', 600: '#8a6642', 700: '#6e4f35',
              800: '#583e2e', 900: '#4a3428', 950: '#2a1c15'
            },
            nature: {
              50: '#f0fdf0', 100: '#dbfcdb', 200: '#b9f7ba', 300: '#82ef87',
              400: '#4cda54', 500: '#2abd33', 600: '#1e9c26', 700: '#1a7a21',
              800: '#1a611f', 900: '#17501c', 950: '#072c0b'
            }
          },
          animation: {
            'fade-in': 'fadeIn 0.5s ease-out',
            'slide-up': 'slideUp 0.4s ease-out',
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'bounce-slow': 'bounce 2s infinite',
            'float': 'float 3s ease-in-out infinite'
          },
          keyframes: {
            fadeIn: {'0%': {opacity: '0'}, '100%': {opacity: '1'}},
            slideUp: {'0%': {opacity: '0', transform: 'translateY(20px)'}, '100%': {opacity: '1', transform: 'translateY(0)'}},
            float: {'0%, 100%': {transform: 'translateY(0px)'}, '50%': {transform: 'translateY(-10px)'}}
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons (vanilla JS) -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- Marked.js for markdown rendering (used by KrishiChat) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Google GenAI SDK -->
  <script type="importmap">
    {
      "imports": {
        "@google/genai": "https://esm.sh/@google/genai"
      }
    }
    </script>

  <style>
    /* Custom scrollbar hide */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Line clamp utilities */
    .line-clamp-1 {
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 1;
      line-clamp: 1;
    }

    .line-clamp-2 {
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      line-clamp: 2;
    }

    .line-clamp-3 {
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      line-clamp: 3;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overscroll-behavior: none;
    }

    /* Glassmorphism */
    .glass {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .dark .glass {
      background: rgba(30, 20, 15, 0.9);
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
    }

    .dark .glass-card {
      background: rgba(40, 30, 25, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Mesh Background */
    .mesh-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
      background: #faf6f1;
    }

    .dark .mesh-bg {
      background: #0f0a08;
    }

    .mesh-circle {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.4;
      animation: meshFloat 20s infinite alternate ease-in-out;
    }

    @keyframes meshFloat {
      0% {
        transform: translate(0, 0) scale(1);
      }

      100% {
        transform: translate(10%, 10%) scale(1.2);
      }
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overscroll-behavior: none;
      min-height: 100vh;
    }
  </style>
</head>

<body
  class="bg-earth-50 dark:bg-earth-950 text-earth-900 dark:text-earth-100 min-h-screen transition-colors duration-300">
  <!-- Mesh Background -->
  <div class="mesh-bg">
    <div class="mesh-circle w-[500px] h-[500px] bg-nature-200/30 dark:bg-nature-900/20 top-[-10%] right-[-10%]"></div>
    <div class="mesh-circle w-[400px] h-[400px] bg-earth-200/40 dark:bg-earth-900/10 bottom-[-10%] left-[-10%]"
      style="animation-delay: -5s;"></div>
    <div class="mesh-circle w-[300px] h-[300px] bg-nature-100/20 dark:bg-nature-800/10 top-[20%] left-[10%]"
      style="animation-delay: -10s;"></div>
  </div>

  <div id="root"></div>

  <!-- Set your Gemini API Key here -->
  <script>
    window.API_KEY = '';
  </script>
  <script type="module" src="js/app.js"></script>
  <script> // Service Worker Registration

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').then(reg => console.log('SW registered:', reg.scope)).catch(err => console.log('SW registration failed:', err));
      });
    }

  </script>
</body>

</html>
